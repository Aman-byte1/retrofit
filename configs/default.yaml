# ============================================================
# Retrofit: Efficient Voice Cloning via Parameter-Efficient Adaptation
# Default Configuration
# ============================================================

# ----- Model -----
model:
  device: "cuda"
  language: "fr"                   # Default language for TTS backbone

# ----- Adapter (THE ONLY TRAINABLE PART) -----
adapter:
  type: "film"                     # "film" (FiLM conditioning) or "additive"
  hidden_dim: 256                  # Adapter MLP hidden dimension
  n_injection_points: 3            # Number of FiLM injection hooks into TTS
  dropout: 0.1

# ----- Speaker Encoder (FROZEN) -----
speaker_encoder:
  model: "speechbrain/spkrec-ecapa-voxceleb"
  embedding_dim: 192

# ----- Training -----
training:
  epochs: 100
  batch_size: 64                   # Large batches for contrastive learning
  learning_rate: 1.0e-3            # Higher LR since adapter is small
  weight_decay: 1.0e-4
  save_every_n_epochs: 25
  log_every_n_steps: 10
  seed: 42

# ----- Data -----
data:
  # Training data
  train_dataset: "iwslt"           # "iwslt" or HF dataset name
  train_language: "fr"
  max_train_samples: null          # null = use all available

  # Evaluation data
  eval_dataset: "amanuelbyte/omnivoice-best-of-n-dev-eval"
  eval_split: "train"
  eval_languages:
    - "fr"
    - "ar"
    - "zh"

# ----- Audio Processing -----
audio:
  sample_rate: 24000

# ----- ASR (for CER) -----
asr:
  model: "large-v3"
  device: "cuda"
  compute_type: "float16"

# ----- Experiment -----
experiment:
  name: "retrofit_voice_cloning"
  output_dir: "./experiments"
  wandb_project: "retrofit-voice-cloning"
  wandb_enabled: false
